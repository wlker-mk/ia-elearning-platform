apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
data:
  redis-url: "{{ .Values.config.redis.url }}"
  rate-limit-max: "{{ .Values.config.rateLimit.max }}"
  rate-limit-window: "{{ .Values.config.rateLimit.window }}"
  cors-allowed-origins: "{{ .Values.config.cors.allowedOrigins }}"
  
  # Service URLs
  user-service-url: "{{ .Values.services.userService }}"
  auth-service-url: "{{ .Values.services.authService }}"
  courses-service-url: "{{ .Values.services.coursesService }}"
  enrollment-service-url: "{{ .Values.services.enrollmentService }}"
  quizzes-service-url: "{{ .Values.services.quizzesService }}"
  payments-service-url: "{{ .Values.services.paymentsService }}"
  bookings-service-url: "{{ .Values.services.bookingsService }}"
  notifications-service-url: "{{ .Values.services.notificationsService }}"
  communications-service-url: "{{ .Values.services.communicationsService }}"
  chatbot-service-url: "{{ .Values.services.chatbotService }}"
  analytics-service-url: "{{ .Values.services.analyticsService }}"
  monitoring-service-url: "{{ .Values.services.monitoringService }}"
  search-service-url: "{{ .Values.services.searchService }}"
  cache-service-url: "{{ .Values.services.cacheService }}"
  storage-service-url: "{{ .Values.services.storageService }}"
  gamification-service-url: "{{ .Values.services.gamificationService }}"
  reviews-service-url: "{{ .Values.services.reviewsService }}"
  webinars-service-url: "{{ .Values.services.webinarsService }}"
  sponsors-service-url: "{{ .Values.services.sponsorsService }}"
  i18n-service-url: "{{ .Values.services.i18nService }}"
  security-service-url: "{{ .Values.services.securityService }}"