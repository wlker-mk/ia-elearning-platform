version: '3.8'

services:
  storage-postgres:
    image: postgres:15
    container_name: storage_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rene
      POSTGRES_DB: storage_db
    ports:
      - "5445:5432"
    volumes:
      - storage_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storage_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-redis:
    image: redis:7-alpine
    container_name: storage_redis
    restart: always
    ports:
      - "6395:6379"
    volumes:
      - storage_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage-service:
    build: .
    container_name: storage_service
    volumes:
      - .:/app
      - storage_media:/app/media
    ports:
      - "8015:8015"
    depends_on:
      storage-postgres:
        condition: service_healthy
      storage-redis:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: "votre-secret-key-storage-service-super-securisee-ici"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "storage_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "rene"
      POSTGRES_PORT: "5432"
      DATABASE_URL: "postgresql://postgres:rene@localhost:5432/storage_db"
      REDIS_URL: "redis://storage-redis:6379/0"
      CELERY_BROKER_URL: "redis://storage-redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://storage-redis:6379/1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,backend,storageEDGE"
      LOG_LEVEL: "INFO"
      JWT_SECRET_KEY: "votre-jwt-secret-key-different-de-django-secret"
      JWT_ACCESS_TOKEN_LIFETIME: "900"
      JWT_REFRESH_TOKEN_LIFETIME: "604800"
      MAX_UPLOAD_SIZE: "10485760"  # 10MB
      ALLOWED_FILE_TYPES: "image/jpeg,image/png,image/gif,application/pdf,text/plain"
      MEDIA_ROOT: "/app/media"
      MEDIA_URL: "/media/"
      STORAGE_SERVICE_URL: "http://storage-service:8015"
      FILE_EXPIRY_DAYS: "30"
      THUMBNAIL_SIZE: "150x150"
      ENABLE_VIRUS_SCAN: "False"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8015/api/storage/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  storage-celery-worker:
    build: .
    container_name: storage_celery_worker
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
      - storage_media:/app/media
    depends_on:
      storage-redis:
        condition: service_healthy
      storage-postgres:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: "votre-secret-key-storage-service-super-securisee-ici"
      POSTGRES_HOST: "storage-postgres"
      POSTGRES_DB: "storage_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "rene"
      POSTGRES_PORT: "5432"
      DATABASE_URL: "postgresql://postgres:rene@storage-postgres:5432/storage_db"
      REDIS_URL: "redis://storage-redis:6379/0"
      CELERY_BROKER_URL: "redis://storage-redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://storage-redis:6379/1"
      MEDIA_ROOT: "/app/media"
    restart: unless-stopped

  storage-celery-beat:
    build: .
    container_name: storage_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    depends_on:
      storage-redis:
        condition: service_healthy
    environment:
      DEBUG: "True"
      SECRET_KEY: "votre-secret-key-storage-service-super-securisee-ici"
      CELERY_BROKER_URL: "redis://storage-redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://storage-redis:6379/1"
    restart: unless-stopped

volumes:
  storage_postgres_data:
  storage_redis_data:
  storage_media: